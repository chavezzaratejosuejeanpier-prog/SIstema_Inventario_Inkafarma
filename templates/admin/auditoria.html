{% extends "base.html" %}
{% block titulo %}Auditoría - Inkafarma{% endblock %}
{% block contenido %}

<div class="flex items-center justify-between mb-6">
  <div>
    <h1 class="text-2xl font-extrabold text-gray-800">Auditoría</h1>
    <p class="text-sm text-gray-400">Historial de quién hizo qué acción y cuándo (últimos 500 registros)</p>
  </div>
</div>

<div class="card">
  <input id="buscador" type="text" placeholder="Buscar por usuario, entidad o detalle..."
         class="w-full mb-4 px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-inka-green"
         oninput="paginaActual = 1; renderTabla()">
  <div class="overflow-x-auto">
    <table class="tabla-inka w-full">
      <thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Entidad</th><th>Detalle</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div id="paginacion"></div>
</div>

{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/auditoria.js') }}"></script>
{% endblock %}
